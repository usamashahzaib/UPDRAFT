<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;background:#000;color:#fff;font:12px/1.3 monospace}
  .row{display:flex;flex-direction:column;gap:2px}
  .lbl{background:#111;padding:2px 6px;color:#0f0}
  .lbl.r{color:#ff0}
  img{display:block;width:100%;height:auto;image-rendering:pixelated}
  .wrap{width:96vw;margin:0 auto}
  h1{font-size:14px;margin:4px}
</style>
</head>
<body>
<h1 id="title">screen</h1>
<div class="wrap">
  <div class="lbl r">REFERENCE (UIUX)</div>
  <img id="ref" src="">
  <div class="lbl">CURRENT (Unity capture)</div>
  <img id="cur" src="">
</div>
<script>
  const q = new URLSearchParams(location.search);
  const r = q.get('ref'), c = q.get('cur'), t = q.get('t');
  if (t) document.getElementById('title').textContent = t;
  if (r) document.getElementById('ref').src = r;
  if (c) document.getElementById('cur').src = c;
</script>
</body>
</html>
