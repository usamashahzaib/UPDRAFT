<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>UPDRAFT — Screen 01 Startup & Connection</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Space+Grotesk:wght@500;700;800;900&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          surface: '#0b1322',
          'surface-dim': '#0b1322',
          'surface-container-lowest': '#060e1d',
          'surface-container-low': '#101827',
          'surface-container': '#141c2b',
          'surface-container-high': '#1b2940',
          'surface-container-highest': '#263a59',
          primary: '#30d5e8',
          'primary-deep': '#138ea3',
          coral: '#ff6376',
          'coral-deep': '#b93a50',
          gold: '#ffd166',
          success: '#7ed68a',
          disabled: '#536176',
          outline: '#49627b',
          'outline-subtle': '#2d3b50',
          'text-primary': '#f4f7fb',
          'text-secondary': '#bbc6d8',
          'text-muted': '#7f8ca3'
        },
        fontFamily: {
          heading: ['Space Grotesk', 'sans-serif'],
          body: ['Hanken Grotesk', 'sans-serif'],
          mono: ['JetBrains Mono', 'monospace']
        }
      }
    }
  }
</script>
<style>
  :root {
    --safe-left: env(safe-area-inset-left, 32px);
    --safe-right: env(safe-area-inset-right, 32px);
    --safe-bottom: env(safe-area-inset-bottom, 24px);
    --safe-top: env(safe-area-inset-top, 24px);
  }
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
    line-height: 1;
    display: inline-block;
    vertical-align: middle;
  }
  @keyframes routeFlow {
    0% { stroke-dashoffset: 280; }
    50% { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: -280; }
  }
  .anim-route {
    stroke-dasharray: 120 160;
    animation: routeFlow 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }
  @keyframes ringPulse {
    0%, 100% { transform: scale(1); opacity: 0.8; }
    50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 12px rgba(255, 209, 102, 0.8)); }
  }
  .anim-gold-ring {
    animation: ringPulse 2.4s ease-in-out infinite;
    transform-origin: center;
  }
</style>
</head>
<body class="bg-[#0b1322] text-text-primary w-screen h-screen overflow-hidden flex flex-col justify-between font-body select-none relative">

  <!-- Switchyard Dawn Atmospheric Backdrop -->
  <div class="absolute inset-0 z-0 pointer-events-none">
    <img src="https://lh3.googleusercontent.com/aida/AEtjO1XKVW9e2vVk7KvrUCafO88D2xLd44MfnYM7ROcptVY9cdrdx5XVLS4pvnh9gX3cfliJ0HG_HiGQ7aLnVvtFOSzBV6uYUCaVgFKd61gnJ2qFJect2ftP2sIlGNE2n9CCbioKl2YVKi3tw74y42TvGHQskAZxcWm6ugx_eeH-3CBuMBR6vHvk5NSrXzabIsXV2PVodW-lvbCgeprK4y7CnOmMTRakG9qAQYcCZWpY3gHmrMPQYKBR3j9MqQ" alt="Switchyard Dawn" class="w-full h-full object-cover object-center filter brightness-[0.45] saturate-[0.85] contrast-[1.1] scale-105" />
    <div class="absolute inset-0 bg-gradient-to-t from-[#060e1d] via-[#0b1322]/80 to-[#0b1322]/40"></div>
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,transparent_40%,#060e1d_95%)]"></div>
    <!-- Subtle technical grid overlay -->
    <div class="absolute inset-0 opacity-[0.07] bg-[linear-gradient(to_right,#30d5e8_1px,transparent_1px),linear-gradient(to_bottom,#30d5e8_1px,transparent_1px)] bg-[size:48px_48px]"></div>
  </div>

  <!-- Top Inset Anchor -->
  <header class="relative z-10 w-full pt-[var(--safe-top)] px-[var(--safe-left)] flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-primary/70 animate-ping"></span>
      <span class="font-mono text-xs text-text-muted tracking-widest uppercase">AIR-GROUND KINETIC RELAY</span>
    </div>
    <div class="font-mono text-[11px] text-text-muted/80 tracking-widest uppercase">
      ANDROID LANDSCAPE • 2400×1080
    </div>
  </header>

  <!-- Central Hero Startup Stage: Wordmark & Air Route Animation -->
  <main class="relative z-10 flex-1 flex flex-col items-center justify-center -mt-6">
    <div class="flex flex-col items-center text-center max-w-lg w-full">
      <!-- Original Vector Wordmark (SVG) -->
      <div class="w-80 h-24 mb-6 relative flex items-center justify-center">
        <svg viewBox="0 0 340 80" class="w-full h-full drop-shadow-[0_0_24px_rgba(48,213,232,0.35)]" fill="none">
          <path d="M14 60L32 18H50L32 60H14Z" fill="#30D5E8" fill-opacity="0.15"/>
          <path d="M18 56C30 32 50 20 80 20" stroke="#30D5E8" stroke-width="3.5" stroke-linecap="round"/>
          <circle cx="80" cy="20" r="4" fill="#30D5E8"/>
          <path d="M70 13L82 20L72 27" stroke="#30D5E8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="34" y1="48" x2="42" y2="40" stroke="#FFD166" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="50" y1="36" x2="58" y2="28" stroke="#FFD166" stroke-width="2.5" stroke-linecap="round"/>
          <text x="96" y="52" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="900" font-size="36" letter-spacing="3.5" fill="#F4F7FB">UPDRAFT</text>
          <rect x="98" y="59" width="112" height="15" rx="3" fill="#1B2940" stroke="#49627B" stroke-width="1"/>
          <text x="103" y="70" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="8.5" letter-spacing="1.5" fill="#30D5E8">ROOFTOP // 3V3 RELAY</text>
        </svg>
      </div>

      <!-- Functional Air Route Trajectory Loader (Pad -> Air Route -> Gold Relay Ring) -->
      <div class="relative w-80 h-24 my-2 flex items-center justify-center">
        <svg viewBox="0 0 320 90" class="w-full h-full" fill="none">
          <!-- Background guide arc -->
          <path d="M 30 70 C 90 20, 220 20, 280 45" stroke="#1b2940" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 6"/>
          
          <!-- Launch Pad representation on left -->
          <circle cx="30" cy="70" r="16" fill="#141c2b" stroke="#49627b" stroke-width="2"/>
          <circle cx="30" cy="70" r="10" fill="#101827" stroke="#30d5e8" stroke-width="1.5"/>
          <path d="M 26 73 L 30 67 L 34 73" stroke="#30d5e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

          <!-- Animated Trajectory Air Route Beam -->
          <path class="anim-route" d="M 30 70 C 90 20, 220 20, 280 45" stroke="#30d5e8" stroke-width="3.5" stroke-linecap="round"/>

          <!-- Wind vector ticks -->
          <line x1="120" y1="36" x2="128" y2="33" stroke="#ffd166" stroke-width="2" stroke-linecap="round"/>
          <line x1="180" y1="30" x2="188" y2="30" stroke="#ffd166" stroke-width="2" stroke-linecap="round"/>

          <!-- Distant Gold Relay Ring Objective on right -->
          <g class="anim-gold-ring">
            <ellipse cx="280" cy="45" rx="14" ry="14" fill="#ffd166" fill-opacity="0.15" stroke="#ffd166" stroke-width="2.5"/>
            <ellipse cx="280" cy="45" rx="6" ry="6" fill="#ffd166"/>
            <!-- Capture compass chevrons -->
            <path d="M 280 26 L 280 30" stroke="#ffd166" stroke-width="2" stroke-linecap="round"/>
            <path d="M 280 60 L 280 64" stroke="#ffd166" stroke-width="2" stroke-linecap="round"/>
            <path d="M 261 45 L 265 45" stroke="#ffd166" stroke-width="2" stroke-linecap="round"/>
            <path d="M 295 45 L 299 45" stroke="#ffd166" stroke-width="2" stroke-linecap="round"/>
          </g>
        </svg>
      </div>

      <!-- Startup Status Readout -->
      <div class="mt-4 flex flex-col items-center gap-2">
        <h2 class="font-heading font-bold text-sm tracking-[0.25em] text-text-primary uppercase">
          PREPARING THE ROOFTOP
        </h2>
        
        <!-- Determinate route progress line -->
        <div class="w-64 h-1.5 rounded-full bg-surface-container-high overflow-hidden border border-outline/40 p-[1px]">
          <div class="h-full rounded-full bg-primary shadow-[0_0_12px_rgba(48,213,232,0.8)] transition-all duration-300 w-3/5"></div>
        </div>

        <p class="font-mono text-xs text-text-muted mt-1">
          Synchronizing Relay protocol nodes...
        </p>
      </div>

    </div>
  </main>

  <!-- Bottom Safe Chrome (Exact Specs) -->
  <footer class="relative z-10 w-full pb-[var(--safe-bottom)] px-[var(--safe-left)] flex items-end justify-between">
    <!-- Brand Slogan (Subtle & Restrained) -->
    <div class="flex flex-col gap-0.5">
      <span class="font-heading text-xs font-semibold text-text-secondary tracking-wide">
        Three players. One team. Three minutes.
      </span>
      <span class="font-body text-[11px] text-text-muted tracking-wide">
        Build shortcuts your enemies can steal.
      </span>
    </div>

    <!-- Android Safe Zone Indicator -->
    <div class="w-36 h-1 rounded-full bg-outline/30 mb-1 self-center"></div>

    <!-- Build/Version Corner Annotation -->
    <div class="flex items-center gap-3">
      <span class="font-mono text-[11px] text-text-muted bg-surface-container-high/80 px-2.5 py-1 rounded border border-outline/40">
        BUILD v0.9.4-PROD
      </span>
    </div>
  </footer>

</body>
</html>
