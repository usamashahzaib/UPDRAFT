version: "3.9"

# Spec section 21: Docker-based backend/database for initial deployment.
# Local dev / staging only — production credentials must not live in this file.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hotdrop
      POSTGRES_USER: hotdrop
      POSTGRES_PASSWORD: CHANGE_ME_LOCAL_DEV_ONLY
    ports:
      - "5432:5432"
    volumes:
      - hotdrop_pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Backend/HotdropBackend/Dockerfile
    depends_on:
      - postgres
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Database=hotdrop;Username=hotdrop;Password=CHANGE_ME_LOCAL_DEV_ONLY"
    ports:
      - "8080:8080"

volumes:
  hotdrop_pgdata:
